name: mcas_companion
description: "MCAS (Mast Cell Activation Syndrome) Companion Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Core & Backend Services
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_app_check: ^0.3.2+10

  # AI & Vision (Using the new official Firebase AI Logic SDK)
  firebase_ai: ^2.3.0          # 👈 Replaces discontinued firebase_vertexai
  google_generative_ai: ^0.4.6 # Keep for BYOK direct key access

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Hardware & Media
  flutter_blue_plus: ^1.34.5
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/data/
